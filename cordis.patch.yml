# dsh-plugin-tool-doctor — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "doctor".
# Tools resultantes: mcp__doctor__* (ver README).
- insert:
    - id: mcp-tool-doctor
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: doctor
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/tool-doctor/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
